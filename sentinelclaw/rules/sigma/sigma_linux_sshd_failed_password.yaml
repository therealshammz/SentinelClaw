rules:
- id: 7c67e8d1-5f0a-4c2b-9e6d-88f9a2b4d501
  title: SSH failed password for invalid user
  description: sshd reported a failed password attempt for an account that does not exist on the host,
    which is a strong indicator of scanning or brute force. Converted from a Sigma syslog/sshd rule (sample
    shipped with the P2-14 sigma layer).
  category: auth
  os:
  - linux
  severity: medium
  confidence: medium
  status: experimental
  enabled: true
  falsepositives:
  - Mail or monitoring scanners probing public SSH endpoints.
  author: SentinelClaw Sigma samples
  date: '2026-09-09'
  tags:
  - attack.credential_access
  - attack.t1110
  mitre:
    technique: T1110
  sigma_logsource:
    category: syslog
    product: linux
    service: sshd
  conditions:
  - field: message
    operator: contains
    value: Failed password for invalid user
