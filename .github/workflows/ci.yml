name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Install pcap extras (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -e ".[dev,pcap]"

      - name: Rules sync check (P2-16)
        # rules/ is the source of truth; fail CI if the packaged
        # sentinelclaw/rules/ copy drifts from it.
        run: python scripts/sync_rules.py --check

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy sentinelclaw

      - name: Test with coverage
        # P0-6 floor gate; raise toward 70% as Phase 1 adds detector tests
        run: pytest --cov=sentinelclaw --cov-report=term-missing -q --cov-fail-under=30

  build:
    # P6-29: produce standalone binaries with PyInstaller so each target
    # OS is exercised by a real build. A local Windows build is not
    # possible on Linux development boxes -- the uploaded artifact is
    # the deliverable ("built binary runs scan/report on the target OS").
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: python -m pip install -e ".[build]"

      - name: Build standalone binary
        run: python -m PyInstaller --noconfirm packaging/sentinelclaw.spec

      - name: Smoke test binary (rules data + scan/report pipeline)
        # Proves the bundled rule data is found (datas) and that the
        # full scan -> report pipeline runs on the target OS.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=dist/sentinelclaw.exe
          else
            BIN=dist/sentinelclaw
          fi
          ./$BIN rules | grep -q "Loaded detection rules" || exit 1
          ./$BIN report --format json >/dev/null
          ls reports

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelclaw-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
